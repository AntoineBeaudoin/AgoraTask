name: Déploiement en continu

on:
  push:
    tags:
      - 'agoratask-v*'

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurer Node.js pour Backend
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Vercel CLI
        run: npm install --global vercel@latest

      - name: Déployer le Backend sur Vercel
        working-directory: ./backend
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Configurer Node.js pour Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/agora_frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend/agora_frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      - name: Compresser le build frontend pour la release
        run: |
          cd frontend/agora_frontend/dist
          zip -r ../../../frontend-dist.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            frontend-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}