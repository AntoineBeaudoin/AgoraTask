name: Intégration en continu

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build Backend Node.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Télécharger le code à jour de la branche
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler / Build backend
        run: npm run build --if-present

  build-frontend:
    name: Build Frontend Vue.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/agora_frontend

    steps:
      - name: Télécharger le code à jour de la branche
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/agora_frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le frontend
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}