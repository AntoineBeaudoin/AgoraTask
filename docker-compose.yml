version: '3.8'

services:
  # Local Database
  postgres-db:
    image: postgres:16-alpine
    container_name: local_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://root:secretpassword@postgres-db:5432/app_db
    depends_on:
      - postgres-db

  # Vue Frontend
  frontend:
    build:
      context: ./frontend/agora_frontend
      dockerfile: Dockerfile
    container_name: vue_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data: